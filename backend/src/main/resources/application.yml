server:
  port: 8080

app:
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:*,http://127.0.0.1:*}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tile_store?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:tile_store_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null
