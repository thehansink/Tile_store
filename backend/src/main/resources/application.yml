server:
  port: ${PORT:8080}

app:
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:*,http://127.0.0.1:*}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:tile_store}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${MYSQLUSER:tile_store_app}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null
